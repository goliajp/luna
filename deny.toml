[graph]
all-features = false
no-default-features = false
exclude-dev = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────
# Advisories — RustSec database checks for known vulnerabilities.
# ─────────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# The crates behind luna-tools' opt-in feature (inferno, pprof) are
# only scanned when cargo-deny runs with `--all-features`;
# see cargo-deny.yml.
ignore = []

# ─────────────────────────────────────────────────────────────────────
# Licenses — only permissive, no GPL contamination.
# ─────────────────────────────────────────────────────────────────────
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    # BSL-1.0 (Boost Software License 1.0) — OSI-approved, FSF-Free,
    # permissive with no source-disclosure / no advertising clauses.
    # Pulled in transitively on Windows hosts through rustyline →
    # clipboard-win + error-code. Equivalent permissiveness to MIT for
    # our embedder-facing surface.
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# Per-crate license exceptions — surgical opt-in for copyleft licenses
# that only enter the workspace through documented opt-in features.
# CDDL stays out of the global allow list above (permissive only, no
# copyleft contamination); users who enable the
# `flame-graph` feature on luna-tools accept the copyleft license
# explicitly when they do so.
exceptions = [
    # `inferno` (CDDL-1.0): flame-graph rendering for luna-profile.
    # Pulled only via `luna-tools` opt-in `flame-graph` feature
    # (`crates/luna-tools/Cargo.toml::[features] flame-graph = ["dep:inferno", "dep:pprof"]`).
    # cargo-deny inspects every crate in Cargo.lock regardless of
    # feature gating, so the exception is required even though
    # default builds never enable the feature.
    { allow = ["CDDL-1.0"], name = "inferno" },
]

# ─────────────────────────────────────────────────────────────────────
# Bans — luna-core's 0-third-party-dep contract.
#
# The hard rule is enforced separately by CI step:
#     cargo tree -p luna-core --prefix none | grep -cE " v[0-9]"
#     # must return 1
#
# This [bans] section catches the *workspace*-level concerns:
# duplicate versions of any dep, accidental wildcard deps, etc.
# ─────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
# `luna-jit-llvm` has a `[dev-dependencies]
# luna-jit = { path = "../luna-jit" }` to drive integration tests that
# need luna-jit's parser. cargo-deny classifies path-only deps as
# wildcards (`version = "*"`), but the lockfile-pinned workspace path
# is the safest possible reference — there is no version-range surface
# for a supply-chain attack to target. Setting this flag tells deny to
# only complain about wildcards that point at the registry, which is
# what "wildcards = deny" is actually meant to catch.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

allow = []
deny = []
# Known duplicate versions, accepted rather than fixed: each pair comes
# from two upstreams that have not moved to the same release yet.
# `multiple-versions = "warn"` keeps new duplication visible without
# failing CI; this list documents the set we accept.
skip = [
    # windows-sys 0.52 via cranelift-jit → region, 0.61 everywhere else.
    "windows-sys",
    # `object` 0.40 is shared by luna-aot / luna-tools and
    # cranelift-object; 0.37 comes via backtrace → dhat (luna-core
    # dev-dep).
    "object",
    # hashbrown 0.14 via inferno → dashmap, 0.16 via gimli 0.33, 0.17
    # via cranelift-codegen.
    "hashbrown",
    # gimli 0.32 via backtrace → addr2line, 0.33 via cranelift-codegen.
    "gimli",
    # bitflags 1.x via pprof → nix 0.26, 2.x everywhere else.
    "bitflags",
    # syn 3 for luna-jit-derive, 2 via the proc-macros of clap, serde,
    # thiserror, zerocopy and cranelift's pulley.
    "syn",
    # The three below come only from luna-tools' `flame-graph` feature
    # and dev-dependencies, at the latest release of each upstream.
    # getrandom 0.3 via inferno 0.12 → ahash 0.8, 0.4 via tempfile 3.27
    # (pprof, and the luna-aot / luna-tools dev-dependency).
    "getrandom",
    # r-efi 5 and 6 follow getrandom 0.3 and 0.4.
    "r-efi",
    # nix 0.26 via pprof 0.15, 0.31 via rustyline 18 (luna-jit's
    # `repl-line-editor`).
    "nix",
]
skip-tree = []

# ─────────────────────────────────────────────────────────────────────
# Sources — only crates.io and the official rustsec repo.
# Embedders auditing luna's supply chain see a clean source list.
# ─────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
