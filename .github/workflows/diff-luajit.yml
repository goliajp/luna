# Differential vs LuaJIT fuzz target nightly.
#
# Why mirror diff-puc.yml: LuaJIT is the de-facto Lua engine
# in Redis-replica / kevy embedder ecosystems. luna currently
# tunes for PUC 5.4/5.5 byte-parity; LuaJIT compat is best-
# effort but undocumented. This job surfaces unintentional
# divergences as nightly issues (NOT ship-blocking).
#
# 100 fuzz iterations green per nightly. Divergences open issues; flaky ones (single-
# fixture re-deflakes) tune grammar in fuzz_diff_luajit.

name: diff-luajit

on:
  schedule:
    # Nightly at 06:30 UTC — staggered after diff-puc's 06:00.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  diff-luajit:
    name: luna-vs-LuaJIT fuzz byte-diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          # scheduled runs start on the default branch (master, the last
          # release); test the code that is about to ship instead
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install LuaJIT (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          echo "LUAJIT=/usr/bin/luajit" >> "$GITHUB_ENV"

      # Record the reference version, and fail if it moves.
      #
      # This comes from apt, so it tracks the runner image rather than a
      # pin of ours: an image refresh can change the differential
      # reference with nothing in our history to show it.
      #
      # LuaJIT is not built from source here because this comparison is
      # best-effort fuzz, not a release gate — 5.1 compatibility
      # only. So instead of pinning the build, we
      # pin the *expectation*: the version is asserted, and the job goes
      # red when the image moves under us. Then it is a deliberate
      # decision to update EXPECTED_LUAJIT, with the change recorded,
      # rather than a silent basis shift.
      #
      # The assertion is a PREFIX ("LuaJIT 2.1"), not the full string.
      # LuaJIT 2.1 is a rolling release whose patch component is a commit
      # timestamp (the runner currently ships 2.1.1703358377), so pinning
      # it exactly would go red on every image refresh — turning this into
      # another job whose red state means nothing. The prefix catches the
      # drift that would actually change semantics (2.1 -> 2.2), while the
      # full version is written to the step summary every run, so the exact
      # basis stays recoverable from the job log.
      - name: Show and assert the LuaJIT version
        env:
          EXPECTED_LUAJIT: "LuaJIT 2.1"
        run: |
          set -euo pipefail
          GOT=$($LUAJIT -v 2>&1 | head -1)
          echo "LuaJIT reference: $GOT"
          echo "luajit-version=$GOT" >> "$GITHUB_STEP_SUMMARY"
          case "$GOT" in
            "$EXPECTED_LUAJIT"*) echo "matches expected prefix: $EXPECTED_LUAJIT" ;;
            *)
              echo "::error::LuaJIT reference moved. Expected prefix '$EXPECTED_LUAJIT', runner now ships '$GOT'. Update EXPECTED_LUAJIT deliberately, noting what changed."
              exit 1
              ;;
          esac

      - name: Install cargo-fuzz
        # Unpinned to match fuzz.yml: a pinned `--locked` cargo-fuzz
        # breaks when a transitive dep uses unstable rustc_* attrs that
        # current nightly rejects. The unpinned install picks the
        # latest cargo-fuzz that works with current nightly (rolls with
        # the toolchain).
        run: cargo install cargo-fuzz

      - name: cargo +nightly fuzz run fuzz_diff_luajit (100 iter)
        # 100 fuzz iterations per nightly.
        # `-runs=100` caps iteration count; `-max_total_time=300`
        # 5min wall-clock cap matches diff-puc.yml's timeout shape.
        # Failures panic with full source + both outputs for
        # divergence triage.
        working-directory: crates/luna-fuzz
        run: |
          cargo +nightly fuzz run --fuzz-dir . fuzz_diff_luajit \
            -- -runs=100 -max_total_time=300
