# Differential vs LuaJIT fuzz target nightly.
#
# Why mirror diff-puc.yml: LuaJIT is the de-facto Lua engine
# in Redis-replica / kevy embedder ecosystems. luna currently
# tunes for PUC 5.4/5.5 byte-parity; LuaJIT compat is best-
# effort but undocumented. This job surfaces unintentional
# divergences as nightly issues (NOT ship-blocking).
#
# 100 fuzz iterations green per nightly. Divergences open issues; flaky ones (single-
# fixture re-deflakes) tune grammar in fuzz_diff_luajit.

name: diff-luajit

on:
  schedule:
    # Nightly at 06:30 UTC — staggered after diff-puc's 06:00.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  diff-luajit:
    name: luna-vs-LuaJIT fuzz byte-diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          # scheduled runs start on the default branch (master, the last
          # release); test the code that is about to ship instead
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - uses: dtolnay/rust-toolchain@nightly

      # upstream LuaJIT (official repo, v2.1 branch) at a pinned commit: the
      # distro package moves with the runner image, and ubuntu 26.04 ships the
      # OpenResty fork, whose `-v` still starts with "LuaJIT 2.1". the last
      # version component is the commit timestamp, so the asserted string
      # identifies the commit; moving the pin means editing both values
      - name: Build LuaJIT (pinned upstream commit)
        env:
          LUAJIT_SHA: c6ffc141a8762b41703f9287d63d93622a13dd8f
        run: |
          set -euo pipefail
          git init -q /tmp/luajit && cd /tmp/luajit
          git fetch -q --depth 1 https://github.com/LuaJIT/LuaJIT.git "$LUAJIT_SHA"
          git checkout -q FETCH_HEAD
          make -j"$(nproc)"
          echo "LUAJIT=/tmp/luajit/src/luajit" >> "$GITHUB_ENV"

      - name: Show and assert the LuaJIT version
        env:
          EXPECTED_LUAJIT: "LuaJIT 2.1.1788856981"
        run: |
          set -euo pipefail
          GOT=$($LUAJIT -v 2>&1 | head -1)
          echo "LuaJIT reference: $GOT"
          echo "luajit-version=$GOT" >> "$GITHUB_STEP_SUMMARY"
          case "$GOT" in
            "$EXPECTED_LUAJIT "*) echo "matches expected: $EXPECTED_LUAJIT" ;;
            *)
              echo "::error::expected '$EXPECTED_LUAJIT', built '$GOT'"
              exit 1
              ;;
          esac

      - name: Install cargo-fuzz
        # Unpinned to match fuzz.yml: a pinned `--locked` cargo-fuzz
        # breaks when a transitive dep uses unstable rustc_* attrs that
        # current nightly rejects. The unpinned install picks the
        # latest cargo-fuzz that works with current nightly (rolls with
        # the toolchain).
        run: cargo install cargo-fuzz

      - name: cargo +nightly fuzz run fuzz_diff_luajit (100 iter)
        # 100 fuzz iterations per nightly.
        # `-runs=100` caps iteration count; `-max_total_time=300`
        # 5min wall-clock cap matches diff-puc.yml's timeout shape.
        # Failures panic with full source + both outputs for
        # divergence triage.
        working-directory: crates/luna-fuzz
        run: |
          cargo +nightly fuzz run --fuzz-dir . fuzz_diff_luajit \
            -- -runs=100 -max_total_time=300
