name: ci

on:
  push:
    branches: [master, develop]
    paths-ignore: ['**/*.md', 'docs/**', 'web/**']
  pull_request:
    branches: [master, develop]
    paths-ignore: ['**/*.md', 'docs/**', 'web/**']
  workflow_dispatch:

# a newer push supersedes a running check; master and tag runs are release runs and always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Native build + test matrix.
  # Stable toolchain across three OS × the standard cargo commands.
  # ─────────────────────────────────────────────────────────────────
  native:
    name: ${{ matrix.os }} stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 is covered by macos-latest and ubuntu-26.04-arm.
        #
        # xcode-27 is the only hosted label on macOS 27 (arm64); macos-latest
        # is still macOS 26
        #
        # windows-11-arm is left out: cranelift-object's PE/COFF
        # backend lacks `Aarch64AdrGotPage21` relocation support
        # (`not implemented: Aarch64AdrGotPage21 is not supported for
        # this file format`, cranelift-object 0.136.1
        # src/backend.rs:988). Requires upstream cranelift work.
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - xcode-27
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # the AOT tests build and run both Windows targets natively: MSVC
      # (cl.exe / link.exe found in the Visual Studio install) and MinGW
      # (the runner's C:\mingw64 gcc)
      - name: rustup target add x86_64-pc-windows-gnu
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          # keep what cargo built for workspace crates too: pruning them
          # leaves fingerprints that call a removed staticlib fresh (the
          # aot tests' nested helper build then finds no library)
          cache-workspace-crates: "true"
      # Exclude LLVM-backed alt-backend crates.
      # `llvm-jit-probe` + `luna-jit-llvm` unconditionally link inkwell
      # → llvm-sys → system LLVM 18 + Polly; none of the hosted runners
      # (ubuntu-latest / macos-latest / windows-latest) ship LLVM 18 +
      # Polly out of the box (`could not find native static library
      # Polly`). They are dev-only alt-backend crates outside the
      # embedder surface.
      - name: cargo build --workspace
        run: cargo build --workspace --all-targets --exclude llvm-jit-probe --exclude luna-jit-llvm
      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib --exclude llvm-jit-probe --exclude luna-jit-llvm
      - name: cargo test --workspace --release
        # `--nocapture` propagates test-side eprintln + println straight
        # to the CI log so a process-level abort (SIGSEGV / SIGILL / signal:
        # N) leaves the `[official_run] starting Lua5X/file.lua` trail
        # visible — without it, cargo test buffers per-test output and a
        # hard abort drops the buffer.
        run: cargo test --workspace --release --exclude llvm-jit-probe --exclude luna-jit-llvm -- --nocapture
        # fat LTO made every test binary a whole-program link (6x the build
        # time) and no test depends on it; lto.yml runs the suite as shipped
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace --exclude llvm-jit-probe --exclude luna-jit-llvm

  # ─────────────────────────────────────────────────────────────────
  # A Windows host with LLVM but without Visual Studio's C++ tools.
  # Visual Studio is hidden by moving the installer's instance records
  # away: find-msvc-tools (luna-aot's lookup, and the cc crate's), vswhere
  # and lld-link all find an installation through them, and cl.exe is not
  # on PATH. (VC\Tools\MSVC itself cannot be renamed on the runner: it
  # is in use.) The MSVC CRT and Windows SDK come from `xwin splat` into
  # cargo-xwin's cache directory. Cargo is set up for that machine as its
  # user would set it up (lld-link and LIB for rustc, clang-cl for cc);
  # luna-aot gets nothing: it falls back to clang-cl + lld-link on PATH
  # and finds the sysroot itself. A binary linked by link.exe carries a
  # "Rich" record, one linked by lld-link does not; the job checks both.
  # ─────────────────────────────────────────────────────────────────
  windows-llvm-only:
    name: windows-latest AOT with LLVM only
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: rustup target add x86_64-pc-windows-gnu
        run: rustup target add x86_64-pc-windows-gnu
      - name: with Visual Studio, luna-aot links with link.exe
        shell: pwsh
        run: |
          'print("aot")' | Set-Content hello.lua
          cargo run -q -p luna-aot --release -- compile hello.lua --out vs.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "luna-aot failed" }
          $out = & .\vs.exe
          if ($out -ne "aot") { throw "vs.exe printed $out" }
          # link.exe writes a "Rich" record into the DOS stub, lld-link does not
          $rich = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("vs.exe")[0..1023]).Contains("Rich")
          "vs.exe: Rich record present = $rich"
          if ($rich -ne $true) { throw "unexpected linker for vs.exe" }
      - uses: actions/cache@v6
        id: xwin-cache
        with:
          path: ~\AppData\Local\cargo-xwin\xwin
          key: xwin-0.10.0-splat-x86_64-windows-v1
      - name: xwin splat into cargo-xwin's cache directory
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          gh release download 0.10.0 -R Jake-Shadle/xwin --pattern 'xwin-0.10.0-x86_64-pc-windows-msvc.tar.gz'
          echo "96e83665ef5c1406aabd0be603a8d08e67e604f36fda630b6807ee948a614e26  xwin-0.10.0-x86_64-pc-windows-msvc.tar.gz" | sha256sum -c -
          tar -xzf xwin-0.10.0-x86_64-pc-windows-msvc.tar.gz
          # xwin moves files from its download cache into place, so both
          # must be on the same drive
          ./xwin-0.10.0-x86_64-pc-windows-msvc/xwin.exe --accept-license \
            --cache-dir "$LOCALAPPDATA/xwin-download" splat --output "$LOCALAPPDATA/cargo-xwin/xwin"
      - name: hide Visual Studio and set cargo up for LLVM
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Rename-Item "$env:ProgramData\Microsoft\VisualStudio\Packages\_Instances" "_Instances.hidden"
          $found = & $vswhere -all -prerelease -products * -property installationPath
          if ($found) { throw "vswhere still finds $found" }
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) { throw "cl.exe is on PATH" }
          Get-Command clang-cl.exe, lld-link.exe | Format-Table Name, Source
          $x = "$env:LOCALAPPDATA\cargo-xwin\xwin"
          # LIB, not RUSTFLAGS: lld-link reads it for every link, including
          # the build scripts of a `--target x86_64-pc-windows-gnu` build
          $libs = "crt\lib\x86_64", "sdk\lib\um\x86_64", "sdk\lib\ucrt\x86_64" | ForEach-Object { "$x\$_" }
          $incs = "crt\include", "sdk\include\ucrt", "sdk\include\um", "sdk\include\shared" | ForEach-Object { "/imsvc$x\$_" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link" >> $env:GITHUB_ENV
          "LIB=$($libs -join ';')" >> $env:GITHUB_ENV
          "CC_x86_64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CFLAGS_x86_64_pc_windows_msvc=$($incs -join ' ')" >> $env:GITHUB_ENV
      - name: without it, luna-aot links with lld-link
        shell: pwsh
        run: |
          'print("aot")' | Set-Content hello.lua
          cargo run -q -p luna-aot --release -- compile hello.lua --out llvm.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "luna-aot failed" }
          $out = & .\llvm.exe
          if ($out -ne "aot") { throw "llvm.exe printed $out" }
          # link.exe writes a "Rich" record into the DOS stub, lld-link does not
          $rich = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("llvm.exe")[0..1023]).Contains("Rich")
          "llvm.exe: Rich record present = $rich"
          if ($rich -ne $false) { throw "unexpected linker for llvm.exe" }
      - name: cargo test -p luna-aot (LLVM only)
        run: cargo test -p luna-aot --release --test it -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # wasm32 build of luna-core only (luna pulls Cranelift, which has
  # no wasm32 target). Proves the 0-dep core also satisfies the
  # wasm portability contract documented in docs/architecture.md.
  # ─────────────────────────────────────────────────────────────────
  wasm32:
    name: wasm32-unknown-unknown — luna-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo build -p luna-core --target wasm32-unknown-unknown
        run: cargo build -p luna-core --target wasm32-unknown-unknown
      - name: cargo build -p luna-core --target wasm32-unknown-unknown --release
        run: cargo build -p luna-core --target wasm32-unknown-unknown --release

  # ─────────────────────────────────────────────────────────────────
  # wasm32-wasip1 build of luna-core. Mirrors the
  # `wasm32` job above. wasip1 has more std::process surface than
  # wasm32-unknown-unknown, so `io.popen` / `os.execute` are
  # cfg-gated on `any(unix, windows)`; wasi gets a stub that returns
  # the PUC error tuple `(nil, "popen not supported on this platform", -1)`.
  #
  # Build-only: catches a cfg-gate forgotten on a new
  # `std::process::*` use. It does not run anything under a wasi
  # runtime.
  # ─────────────────────────────────────────────────────────────────
  wasm32-wasip1:
    name: wasm32-wasip1 — luna-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: cargo build -p luna-core --target wasm32-wasip1
        run: cargo build -p luna-core --target wasm32-wasip1
      - name: cargo build -p luna-core --target wasm32-wasip1 --release
        run: cargo build -p luna-core --target wasm32-wasip1 --release

  # ─────────────────────────────────────────────────────────────────
  # msrv: the workspace declares rust-version = "1.96"; build every
  # target on exactly that toolchain so the declaration can fail.
  # ─────────────────────────────────────────────────────────────────
  msrv:
    name: cargo check (rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - name: cargo check --workspace --all-targets
        # See the `native` job comment for the LLVM exclusion rationale.
        run: cargo check --workspace --all-targets --exclude llvm-jit-probe --exclude luna-jit-llvm

  # ─────────────────────────────────────────────────────────────────
  # cargo doc: catches dangling intra-doc links and undocumented
  # public items.
  # ─────────────────────────────────────────────────────────────────
  doc:
    name: cargo doc --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc --workspace --no-deps
        # See the `native` job comment for the LLVM exclusion rationale.
        run: cargo doc --workspace --no-deps --exclude llvm-jit-probe --exclude luna-jit-llvm
        env:
          RUSTDOCFLAGS: -D warnings

  # ─────────────────────────────────────────────────────────────────
  # Lint gates (fmt + clippy). Both fail the build on any drift;
  # clippy policy lives in the workspace `[lints.clippy]` table.
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        # See the `native` job comment for the LLVM exclusion rationale.
        run: cargo clippy --workspace --all-targets --exclude llvm-jit-probe --exclude luna-jit-llvm -- -D warnings

  # ─────────────────────────────────────────────────────────────────
  # luna-core's 0 third-party dep contract.
  # `cargo tree -p luna-core --prefix none --edges normal` lists exactly
  # one crate (luna-core itself); anything else is a prod-dep regression.
  # `--edges normal` excludes dev-dependencies (e.g. `dhat`, used by the
  # `mem_baseline` bench) and build-dependencies — those never link
  # into the published crate, so the 0-third-party-dep contract is
  # preserved. CI fails fast on regression.
  # ─────────────────────────────────────────────────────────────────
  zero-dep:
    name: luna-core zero-third-party-dep contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo tree -p luna-core
        run: |
          count=$(cargo tree -p luna-core --prefix none --no-default-features --edges normal 2>/dev/null \
                  | grep -cE ' v[0-9]')
          echo "luna-core prod dep count = $count"
          if [ "$count" != "1" ]; then
            echo "::error::luna-core gained a third-party prod dependency (count=$count, expected 1)"
            cargo tree -p luna-core --prefix none --no-default-features --edges normal
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # Build the optional `repl-line-editor` feature so
  # rustyline-side bit-rot doesn't surprise us at release time. The
  # default `cargo install luna-jit` (no feature) is already covered
  # by the `native` matrix above; this job adds the feature-on flavour
  # + clippy gate to keep the LuaHelper / highlighter trait wiring
  # honest. luna-core's 0-third-party-dep contract is unaffected
  # (rustyline lives in luna-jit only) — verified by the `zero-dep`
  # job above.
  # ─────────────────────────────────────────────────────────────────
  repl-line-editor:
    name: ${{ matrix.os }} luna-jit --features repl-line-editor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build -p luna-jit --features repl-line-editor
        run: cargo build -p luna-jit --features repl-line-editor
      - name: cargo clippy -p luna-jit --bin luna --features repl-line-editor -- -D warnings
        run: cargo clippy -p luna-jit --bin luna --features repl-line-editor -- -D warnings
      # piped stdin takes lua.c's plain-line path; on Windows the REPL also
      # runs on a pseudo console, where the line editor reads the lines
      - name: cargo test -p luna-jit --features repl-line-editor --test it -- cli_repl
        run: cargo test -p luna-jit --features repl-line-editor --test it -- cli_repl

  # ─────────────────────────────────────────────────────────────────
  # feature="send" matrix coverage. SendVm is the
  # cross-thread embedding path; its tests live in
  # `crates/luna-core/tests/it/send_vm.rs` and are gated behind
  # `#[cfg(feature = "send")]`. Without an explicit CI job, the
  # default `cargo test` invocation never exercises the feature,
  # so SendVm bit-rot would only surface at a release-time smoke.
  # This job builds + clippies + tests luna-core with the feature
  # flipped on so any regression in the lock / UnsafeCell wrapper
  # lands as a red gate.
  # ─────────────────────────────────────────────────────────────────
  send-feature:
    name: luna-core --features send build + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo build -p luna-core --features send
        run: cargo build -p luna-core --features send
      - name: cargo clippy -p luna-core --features send --tests -- -D warnings
        run: cargo clippy -p luna-core --features send --tests -- -D warnings
      - name: 'cargo test -p luna-core --features send --test it -- send_vm::'
        run: 'cargo test -p luna-core --features send --test it -- send_vm::'
      # a JIT Vm of a shared engine, moved to another thread, installs the
      # engine's traces there
      - name: 'cargo test -p luna-jit --features send --test it -- engine_shared_traces::'
        run: 'cargo test -p luna-jit --features send --test it -- engine_shared_traces::'

  # ─────────────────────────────────────────────────────────────────
  # unsafe-usage drift detection.
  #
  # Counts `unsafe (\{|fn |impl |trait |extern )` lines in every `.rs`
  # file under crates/ (src, tests, benches, examples of every crate,
  # luna-jit-llvm included although CI does not build it) and fails if
  # the count exceeds the recorded ceiling. Cheap (no cargo-geiger
  # install) and catches the common case: someone adds an
  # `unsafe { ... }` block to silence a borrow-check error rather than
  # fix the root cause. The lint job's clippy run checks the other half:
  # `undocumented_unsafe_blocks` is a workspace lint, so a block without
  # a SAFETY note fails it.
  #
  # The ceiling is the exact count. Until October 2026 only luna-core and
  # luna-jit src were counted (490 through v1.3, 575 after the audit of
  # the interpreter performance work). The audit that extended the count
  # to every crate brought the whole tree from 981 to 862. Typing the
  # raw pointers that safe functions used to accept (a block per
  # handle built from a pointer, mostly in the luna_jit_* helpers) took
  # it to 908; the baseline trace tier's code pages and entries took it
  # to 921; rooting the values a trace holds only in registers across
  # helpers that can collect took it to 924; inlining calls into other
  # prototypes took it to 936, running AOT binaries of other dialects to
  # 938, sharing compiled code between Vms to 948, read-only tables (the
  # table flag, its debug check, a test) to 952, the trace
  # machine-code dump to 953, and the C API's message handlers, read-only
  # tables and per-dialect states with their tests, and a test of the
  # host's `%p`, and C-style standard output writing descriptor 1, to
  # 978, the ceiling now.
  # docs/unsafe-accounting.md has the count per crate and module
  # and why each kind of site exists. Each justified unsafe addition
  # needs an explicit ceiling bump to the new exact count. Never widen to
  # a round number to silence drift.
  # ─────────────────────────────────────────────────────────────────
  unsafe-drift:
    name: unsafe-usage drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: count first-party unsafe sites
        run: |
          count=$(grep -rE --include='*.rs' 'unsafe (\{|fn |impl |trait |extern )' \
                  crates | wc -l | tr -d ' ')
          ceiling=1390
          echo "first-party unsafe sites: $count (ceiling $ceiling)"
          echo "per-module counts and reasons: docs/unsafe-accounting.md"
          if [ "$count" -gt "$ceiling" ]; then
            echo "::error::unsafe count $count exceeds ceiling $ceiling"
            echo "Either justify the new unsafe (and bump the ceiling in ci.yml) or refactor."
            exit 1
          fi
