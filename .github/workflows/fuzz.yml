name: fuzz

on:
  pull_request:
    branches: [master, develop]
  schedule:
    # nightly 60 min per target against develop
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        # a release dispatches the short run; depth comes from the nightly one
        description: "minutes per target"
        default: "10"
        required: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # PR-gate fuzz smoke. 5 min per target,
  # non-blocking (any crash uploads as artifact, gate doesn't fail
  # the PR). The point at PR time is to catch regressions that an
  # incoming change immediately reproduces from scratch; deeper
  # coverage lives in the nightly campaign below.
  # ─────────────────────────────────────────────────────────────────
  fuzz-pr-smoke:
    name: fuzz 5-min smoke (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parser
          - fuzz_dump_reader
          - fuzz_vm_dispatch
          - fuzz_aot_meta
          - fuzz_gc
          - fuzz_diff_puc
          - fuzz_dump_puc
          - fuzz_jit_diff
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: install PUC lua 5.5.1 (PUC differential targets)
        if: matrix.target == 'fuzz_diff_puc' || matrix.target == 'fuzz_dump_puc'
        # always the source release: apt's lua5.5 is 5.5.0 on ubuntu 26.04,
        # which would silently replace the differential reference
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libreadline-dev curl
          mkdir -p /tmp/puc-build && cd /tmp/puc-build
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o lua.tar.gz
          echo "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce  lua.tar.gz" | sha256sum -c -
          tar -xzf lua.tar.gz && cd lua-5.5.1
          make linux-readline
          sudo make install INSTALL_TOP=/usr/local
          GOT=$(/usr/local/bin/lua -v 2>&1)
          case "$GOT" in
            "Lua 5.5.1"*) echo "PUC 5.5 pin OK: $GOT" ;;
            *) echo "::error::expected Lua 5.5.1, got: $GOT"; exit 1 ;;
          esac
          echo "PUC_LUA=/usr/local/bin/lua" >> "$GITHUB_ENV"
      - name: build fuzz target
        working-directory: crates/luna-fuzz
        # `--fuzz-dir .` because `crates/luna-fuzz/` IS itself the
        # fuzz crate (canonical cargo-fuzz layout expects a `fuzz/`
        # subdir below the crate; ours uses the crate-as-fuzz-crate
        # convention so the `[workspace] exclude` only needs to skip
        # one path, not two).
        run: cargo +nightly fuzz build ${{ matrix.target }} --fuzz-dir .
      - name: run fuzz target 5 min
        working-directory: crates/luna-fuzz
        env:
          ASAN_OPTIONS: malloc_context_size=10
        run: cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir . -- -max_total_time=300
      - name: upload artifacts on crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          # cargo fuzz --fuzz-dir . writes artifacts under the fuzz dir itself
          path: crates/luna-fuzz/artifacts/${{ matrix.target }}/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────
  # Campaign: 60 min per target nightly on develop, or `minutes` when
  # dispatched. Non-blocking. Any crashes upload for triage and get
  # converted to regression tests.
  # ─────────────────────────────────────────────────────────────────
  fuzz-campaign:
    name: fuzz campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parser
          - fuzz_dump_reader
          - fuzz_vm_dispatch
          - fuzz_aot_meta
          - fuzz_gc
          - fuzz_diff_puc
          - fuzz_dump_puc
          - fuzz_jit_diff
    steps:
      - uses: actions/checkout@v7
        with:
          # scheduled runs start on the default branch (master, the last
          # release); fuzz the code that is about to ship instead
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: install PUC lua 5.5.1 (PUC differential targets)
        if: matrix.target == 'fuzz_diff_puc' || matrix.target == 'fuzz_dump_puc'
        # always the source release: apt's lua5.5 is 5.5.0 on ubuntu 26.04,
        # which would silently replace the differential reference
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libreadline-dev curl
          mkdir -p /tmp/puc-build && cd /tmp/puc-build
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o lua.tar.gz
          echo "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce  lua.tar.gz" | sha256sum -c -
          tar -xzf lua.tar.gz && cd lua-5.5.1
          make linux-readline
          sudo make install INSTALL_TOP=/usr/local
          GOT=$(/usr/local/bin/lua -v 2>&1)
          case "$GOT" in
            "Lua 5.5.1"*) echo "PUC 5.5 pin OK: $GOT" ;;
            *) echo "::error::expected Lua 5.5.1, got: $GOT"; exit 1 ;;
          esac
          echo "PUC_LUA=/usr/local/bin/lua" >> "$GITHUB_ENV"
      - name: build fuzz target
        working-directory: crates/luna-fuzz
        # `--fuzz-dir .` because `crates/luna-fuzz/` IS itself the
        # fuzz crate (canonical cargo-fuzz layout expects a `fuzz/`
        # subdir below the crate; ours uses the crate-as-fuzz-crate
        # convention so the `[workspace] exclude` only needs to skip
        # one path, not two).
        run: cargo +nightly fuzz build ${{ matrix.target }} --fuzz-dir .
      - name: run fuzz target
        working-directory: crates/luna-fuzz
        env:
          MINUTES: ${{ inputs.minutes || '60' }}
          # ASan keeps every distinct allocation and free stack until the
          # process exits. The compiler's recursion (and Cranelift, for the
          # JIT target) keeps producing new ones over a long campaign, so
          # with the default 30 frames the kept stacks alone grow by
          # hundreds of MB. Ten frames still locate the allocation; replay
          # a saved input locally for full stacks.
          ASAN_OPTIONS: malloc_context_size=10
        run: cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir . -- -max_total_time=$((MINUTES * 60))
      - name: upload artifacts on crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-campaign-${{ matrix.target }}
          # cargo fuzz --fuzz-dir . writes artifacts under the fuzz dir itself
          path: crates/luna-fuzz/artifacts/${{ matrix.target }}/
          retention-days: 365

  # ─────────────────────────────────────────────────────────────────
  # Make "no unhandled crash class" a check that can FAIL.
  #
  # Both fuzz jobs above are `continue-on-error: true`, which is right
  # for the fuzzing itself: a crash needs human triage, not a blocked
  # branch. But the side effect is that this workflow reports `success`
  # even when a target crashed, so its conclusion proves only that the
  # run happened — not that nothing was found. This job asserts the
  # second claim.
  #
  # The fuzz jobs upload an artifact only on crash (`if: failure()`), so
  # "this run produced an artifact" is exactly "a target crashed". This
  # job turns that into a red signal.
  # ─────────────────────────────────────────────────────────────────
  crash-check:
    name: no unhandled fuzz crashes
    needs: [fuzz-campaign]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: fail if any fuzz target uploaded a crash artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '[.artifacts[] | select(.name | startswith("fuzz-crash"))] | length')
          echo "crash artifacts in this run: $N"
          echo "fuzz-crash-artifacts=$N" >> "$GITHUB_STEP_SUMMARY"
          if [ "$N" -ne 0 ]; then
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("fuzz-crash")) | "  \(.name)"'
            echo "::error::A fuzz target crashed. Triage the artifact and convert it to a regression test before this goes green again."
            exit 1
          fi
          # A second signal that does not share the upload's failure
          # modes: the campaign jobs' own conclusions. A wrong upload
          # path uploads nothing, and the artifact check alone would then
          # stay green while targets fail.
          F=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name | startswith("fuzz campaign")) | select(.conclusion == "failure")] | length')
          echo "failed fuzz jobs in this run: $F"
          echo "fuzz-failed-jobs=$F" >> "$GITHUB_STEP_SUMMARY"
          if [ "$F" -ne 0 ]; then
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("fuzz campaign")) | select(.conclusion == "failure") | "  \(.name)"'
            echo "::error::A fuzz job failed without leaving an artifact. Find out why before this goes green again."
            exit 1
          fi
          echo "no crashes — #10's 'no unhandled crash class' holds for this run"
