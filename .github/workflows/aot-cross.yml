name: aot-cross

# Cross-compile matrix expansion. Tier-1 targets (macOS aarch64,
# Linux x86_64, Linux musl, Mach-O cross, and Windows MSVC + MinGW
# built and run natively on ci.yml's windows-latest leg) are covered
# elsewhere. This workflow adds
# tier-2 coverage:
#
# - RISC-V 64-bit (build-only — no actual run on real hardware)
# - s390x (build-only — same)
# - Wine MinGW PE actual-run on a Linux host (build + run)
# - MSVC PE from a Linux host with clang-cl + lld-link and an xwin
#   sysroot, run under Wine; and from a macOS host, run on Windows
#
# The Wine, MSVC and Alpine jobs also build one tiny program per dialect
# (5.1-5.5) and check that each binary reports its own dialect.
#
# Run conditions:
# - Push to develop / master
# - Manual workflow_dispatch
# - Weekly cron (Mondays 06:00 UTC) — picks up cranelift / target
#   spec drift without a code commit
#
# Non-blocking — failure here does not gate PR merge (the matrix
# expands the cross-compile reach, but tier-1 targets in ci.yml are
# the hard gate). See `docs/aot.md` §3 for the tier-1 vs tier-2 split.

on:
  push:
    branches: [develop, master]
    paths-ignore: ['**/*.md', 'docs/**', 'web/**']
  pull_request:
    branches: [develop, master]
    paths-ignore: ['**/*.md', 'docs/**', 'web/**']
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# a newer push supersedes a running check; master and tag runs are release runs and always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Tier-2 build-only: cargo + cranelift + luna-aot pipeline must
  # produce a .o-emit pass for each tier-2 triple. The link step
  # self-skips without a matching cc — the produced .o tells us the
  # codegen surface still works for the triple even without an
  # installed cross-linker.
  # ─────────────────────────────────────────────────────────────────
  tier2-build:
    name: tier-2 build ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo build -p luna-aot (host bin)
        run: cargo build -p luna-aot --release
      - name: compile fib.lua for ${{ matrix.target }}
        run: |
          cat > /tmp/fib.lua <<'EOF'
          local function fib(n)
            if n < 2 then return n end
            return fib(n-1) + fib(n-2)
          end
          return fib(20)
          EOF
          # The link step may fail without the cross-linker on the
          # GH runner; capture exit but record whether codegen ran.
          ./target/release/luna-aot compile /tmp/fib.lua \
            --target ${{ matrix.target }} \
            --out /tmp/fib-${{ matrix.target }} \
            || echo "link skipped (no cross-cc for ${{ matrix.target }} on runner)"
      - name: report
        if: always()
        run: |
          if [ -f "/tmp/fib-${{ matrix.target }}" ]; then
            echo "✓ ${{ matrix.target }} produced binary"
            file /tmp/fib-${{ matrix.target }}
            ls -l /tmp/fib-${{ matrix.target }}
          else
            echo "ℹ ${{ matrix.target }} codegen-only (link skipped)"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Wine MinGW PE actual-run: build a Windows .exe via MinGW
  # cross-toolchain on a Linux host, then run it under Wine.
  # ─────────────────────────────────────────────────────────────────
  wine-mingw-pe-run:
    name: Wine MinGW PE actual-run
    runs-on: ubuntu-latest
    # No continue-on-error: a soft-fail here masks each breakage behind
    # the previous one, so this job must be able to fail.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: install MinGW + Wine
        run: |
          set -u
          sudo apt-get update -qq
          # `wine64` is gone on Ubuntu 24.04 (noble) — apt reports
          # success while installing nothing usable. Try the candidates
          # in order and report what the archive actually has if none of
          # them yields a binary.
          for pkg in wine wine64 wine-stable; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              echo "installing $pkg"
              sudo apt-get install -y --no-install-recommends mingw-w64 "$pkg" || true
            fi
            WINE_BIN=$(command -v wine || command -v wine64 || command -v wine-stable || true)
            [ -n "$WINE_BIN" ] && break
          done
          if [ -z "${WINE_BIN:-}" ]; then
            echo "::error::no wine binary on PATH after trying wine / wine64 / wine-stable"
            echo "--- wine-ish packages in the archive ---"
            apt-cache search --names-only '^wine' | head -20 || true
            exit 1
          fi
          echo "WINE_BIN=$WINE_BIN" >> "$GITHUB_ENV"
          echo "using wine binary: $WINE_BIN"
          "$WINE_BIN" --version || true

      - name: cargo build -p luna-aot
        run: cargo build -p luna-aot --release
        # Kept so a compile error surfaces as its own step; the compile
        # below goes through `cargo run` for the reason explained there.

      # Cross-compiling needs luna-aot to run *inside* the
      # workspace, not as a standalone binary.
      #
      # `LUNA_AOT_RUNTIME_HELPERS_STATICLIB` is honoured only for host
      # builds — `build_runtime_helpers_staticlib` gates it on
      # `target_triple.is_none()`, deliberately, so a cross link cannot
      # be handed a staticlib built for the wrong ABI. For a cross
      # target it always builds its own, which means it needs
      # CARGO_MANIFEST_DIR to find the workspace. That variable is set
      # by cargo at compile time and is absent when the binary is
      # invoked directly, so `./target/release/luna-aot --target ...`
      # can never work:
      #   luna-aot: linker failed: CARGO_MANIFEST_DIR not set
      #
      # (That is why the Alpine job's fix does not transfer: it builds
      # natively inside the container, so it is a host build and the
      # override applies.)
      #
      # Running through `cargo run` puts CARGO_MANIFEST_DIR back and
      # lets luna-aot build the windows-gnu staticlib itself.
      - name: compile hello.lua → hello.exe
        run: |
          set -eu
          cat > /tmp/hello.lua <<'EOF'
          print("hello from luna-aot via wine")
          return 42
          EOF
          cargo run -p luna-aot --release -- compile /tmp/hello.lua \
            --target x86_64-pc-windows-gnu \
            --out /tmp/hello.exe
          test -f /tmp/hello.exe || { echo "luna-aot produced no .exe"; exit 1; }
          file /tmp/hello.exe
          file /tmp/hello.exe | grep -q 'PE32+' || { echo "not a PE32+ binary"; exit 1; }

      - name: run hello.exe under wine
        env:
          WINEDEBUG: "-all"
        run: |
          set -u
          # Exit-code propagation through wine varies by version, so the
          # assertion is on the program's OUTPUT, not its status.
          OUT=$("$WINE_BIN" /tmp/hello.exe 2>&1) || true
          echo "$OUT"
          case "$OUT" in
            *"hello from luna-aot via wine"*) echo "PE ran under wine, output matches" ;;
            *) echo "::error::hello.exe did not produce the expected output under wine"; exit 1 ;;
          esac

      # a binary must run its script on a Vm of the dialect it was built
      # for: one tiny program per dialect, checked by the _VERSION it prints
      - name: one program per dialect under wine
        env:
          WINEDEBUG: "-all"
        run: |
          set -eu
          for d in 5.1 5.2 5.3 5.4 5.5; do
            echo 'print(_VERSION)' > /tmp/dialect.lua
            cargo run -q -p luna-aot --release -- compile /tmp/dialect.lua \
              --dialect "$d" --target x86_64-pc-windows-gnu --out "/tmp/dialect-$d.exe"
            OUT=$("$WINE_BIN" "/tmp/dialect-$d.exe" 2>&1) || true
            echo "$d: $OUT"
            case "$OUT" in
              *"Lua $d"*) ;;
              *) echo "::error::dialect $d binary printed: $OUT"; exit 1 ;;
            esac
          done

  # ─────────────────────────────────────────────────────────────────
  # MSVC PE without Visual Studio: clang-cl + lld-link with the MSVC CRT
  # and Windows SDK from `xwin splat`, built on a Linux host and run
  # under Wine (which has its own vcruntime140 and ucrtbase).
  # ─────────────────────────────────────────────────────────────────
  wine-msvc-pe-run:
    name: Wine MSVC PE actual-run (xwin)
    runs-on: ubuntu-latest
    env:
      LUNA_AOT_MSVC_SYSROOT: /home/runner/xwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: install LLVM tools + Wine
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine lld-18 llvm-18 > /dev/null
          # clang-cl, lld-link and llvm-lib carry no version suffix here
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        id: xwin-cache
        with:
          path: /home/runner/xwin
          key: xwin-0.10.0-splat-x86_64-v1
      - name: xwin splat
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download 0.10.0 -R Jake-Shadle/xwin \
            --pattern 'xwin-0.10.0-x86_64-unknown-linux-musl.tar.gz' -D /tmp
          echo "d870eb4b2f390878af6da1ccd3cf321d22fcb72720984853b4be732ae597fc88  /tmp/xwin-0.10.0-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/xwin-0.10.0-x86_64-unknown-linux-musl.tar.gz -C /tmp
          /tmp/xwin-0.10.0-x86_64-unknown-linux-musl/xwin --accept-license splat --output "$LUNA_AOT_MSVC_SYSROOT"

      # the hot loop runs as an AOT trace; its `%` goes through luna_jit_fmod
      - name: one program per dialect under wine
        env:
          WINEDEBUG: "-all"
        run: |
          set -eu
          printf 'local s = 0\nfor i = 1, 100000 do s = s + i %% 7 end\nprint(_VERSION, s)\n' > /tmp/p.lua
          for d in 5.1 5.2 5.3 5.4 5.5; do
            cargo run -q -p luna-aot --release -- compile /tmp/p.lua \
              --dialect "$d" --target x86_64-pc-windows-msvc --out "/tmp/p-$d.exe" > /dev/null
            file "/tmp/p-$d.exe" | grep -q 'PE32+' || { echo "::error::$d: not a PE32+ binary"; exit 1; }
            # wine's own messages go to stderr; the program's output is stdout
            OUT=$(wine "/tmp/p-$d.exe" 2> /dev/null | tr -d '\r') || true
            echo "$d: $OUT"
            [ "$OUT" = "$(printf 'Lua %s\t300000' "$d")" ] || { echo "::error::dialect $d binary printed: $OUT"; exit 1; }
          done

      # with LUNA_AOT_MSVC_SYSROOT set the test must link instead of skipping
      - name: aot_msvc_link with the sysroot
        run: cargo test -p luna-aot --release --test it -- --nocapture aot_msvc_link

  # ─────────────────────────────────────────────────────────────────
  # The same from a macOS host, with Homebrew's LLVM and the sysroot in
  # the directory `cargo xwin` caches it in, which luna-aot finds
  # without LUNA_AOT_MSVC_SYSROOT. The binaries run on a Windows runner.
  # ─────────────────────────────────────────────────────────────────
  macos-msvc-pe-build:
    name: MSVC PE built on macOS (xwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: install LLVM tools
        run: |
          set -eu
          brew install llvm lld > /dev/null
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        id: xwin-cache
        with:
          path: ~/Library/Caches/cargo-xwin/xwin
          key: xwin-0.10.0-splat-x86_64-macos-v1
      - name: xwin splat into cargo-xwin's cache directory
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          # no macOS release binary of xwin
          cargo install xwin --version 0.10.0 --locked
          xwin --accept-license splat --output "$HOME/Library/Caches/cargo-xwin/xwin"
      - name: one program per dialect
        run: |
          set -eu
          printf 'local s = 0\nfor i = 1, 100000 do s = s + i %% 7 end\nprint(_VERSION, s)\n' > /tmp/p.lua
          mkdir -p out
          for d in 5.1 5.2 5.3 5.4 5.5; do
            cargo run -q -p luna-aot --release -- compile /tmp/p.lua \
              --dialect "$d" --target x86_64-pc-windows-msvc --out "out/p-$d.exe" > /dev/null
          done
          file out/*
      - uses: actions/upload-artifact@v7
        with:
          name: macos-msvc-exes
          path: out/

  macos-msvc-pe-run:
    name: MSVC PE built on macOS, run on Windows
    needs: macos-msvc-pe-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-msvc-exes
          path: out
      - shell: bash
        run: |
          set -eu
          for d in 5.1 5.2 5.3 5.4 5.5; do
            OUT=$("out/p-$d.exe" | tr -d '\r')
            echo "$d: $OUT"
            [ "$OUT" = "$(printf 'Lua %s\t300000' "$d")" ] || { echo "::error::dialect $d binary printed: $OUT"; exit 1; }
          done

  # ─────────────────────────────────────────────────────────────────
  # Alpine musl native E2E: in a real Alpine container (rather than
  # the GH runner's glibc), build + run a luna-aot binary against
  # musl directly.
  # ─────────────────────────────────────────────────────────────────
  alpine-musl-e2e:
    name: Alpine musl native E2E
    runs-on: ubuntu-latest
    # No continue-on-error: a gate only counts if it can fail.
    container:
      # current stable, which is above the declared rust-version
      image: rust:alpine
    steps:
      - uses: actions/checkout@v7
      - name: install build deps
        run: apk add --no-cache musl-dev gcc make
      - name: cargo build -p luna-aot
        run: cargo build -p luna-aot --release --target x86_64-unknown-linux-musl

      # `luna-aot` normally locates the workspace via
      # CARGO_MANIFEST_DIR and builds the runtime-helpers staticlib on
      # demand. That variable is a *compile-time* cargo thing and is
      # absent when the binary runs standalone, so the link step fails:
      #   luna-aot: linker failed: CARGO_MANIFEST_DIR not set — cannot
      #   locate workspace to build luna-runtime-helpers.
      # The error names its own escape hatch. Build the staticlib for the
      # same target first and point at it.
      - name: build the runtime-helpers staticlib (musl)
        run: cargo build -p luna-runtime-helpers --release --target x86_64-unknown-linux-musl

      - name: compile + run hello.lua
        run: |
          set -eu
          STATICLIB="$PWD/target/x86_64-unknown-linux-musl/release/libluna_runtime_helpers.a"
          test -f "$STATICLIB" || { echo "staticlib missing at $STATICLIB"; ls -l target/x86_64-unknown-linux-musl/release/ | head -20; exit 1; }
          export LUNA_AOT_RUNTIME_HELPERS_STATICLIB="$STATICLIB"
          echo "using staticlib: $STATICLIB"
          cat > /tmp/hello.lua <<'EOF'
          print("hello from luna-aot on alpine musl")
          return 7
          EOF
          ./target/x86_64-unknown-linux-musl/release/luna-aot compile /tmp/hello.lua --out /tmp/hello
          test -x /tmp/hello || { echo "luna-aot produced no executable"; exit 1; }
          OUT=$(/tmp/hello) ; RC=$?
          echo "output: $OUT"
          echo "exit:   $RC"
          case "$OUT" in
            *"hello from luna-aot on alpine musl"*) echo "E2E ok" ;;
            *) echo "unexpected output"; exit 1 ;;
          esac

      - name: one program per dialect
        run: |
          set -eu
          export LUNA_AOT_RUNTIME_HELPERS_STATICLIB="$PWD/target/x86_64-unknown-linux-musl/release/libluna_runtime_helpers.a"
          for d in 5.1 5.2 5.3 5.4 5.5; do
            echo 'print(_VERSION)' > /tmp/dialect.lua
            ./target/x86_64-unknown-linux-musl/release/luna-aot compile /tmp/dialect.lua \
              --dialect "$d" --out "/tmp/dialect-$d"
            OUT=$("/tmp/dialect-$d")
            echo "$d: $OUT"
            [ "$OUT" = "Lua $d" ] || { echo "dialect $d binary printed: $OUT"; exit 1; }
          done
