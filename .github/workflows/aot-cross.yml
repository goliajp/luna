name: aot-cross

# v2.0 Track AO sub-track AO-CC (cross-compile matrix expansion).
# v1.3 ship verified macOS aarch64 + Linux x86_64 + Linux musl +
# Windows MinGW + Windows MSVC native-host build + Mach-O cross.
# This workflow expands tier-2 coverage:
#
# - RISC-V 64-bit (build-only — no actual run on real hardware)
# - s390x (build-only — same)
# - Wine MinGW PE actual-run on a Linux host (build + run)
#
# Run conditions:
# - Push to develop / master
# - Manual workflow_dispatch
# - Weekly cron (Mondays 06:00 UTC) — picks up cranelift / target
#   spec drift without a code commit
#
# Non-blocking — failure here does not gate PR merge (the matrix
# expands the cross-compile reach, but tier-1 targets in ci.yml are
# the hard gate). See `docs/aot.md` §3 for the tier-1 vs tier-2 split.

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Tier-2 build-only: cargo + cranelift + luna-aot pipeline must
  # produce a .o-emit pass for each tier-2 triple. The link step
  # self-skips without a matching cc — the produced .o tells us the
  # codegen surface still works for the triple even without an
  # installed cross-linker.
  # ─────────────────────────────────────────────────────────────────
  tier2-build:
    name: tier-2 build ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo build -p luna-aot (host bin)
        run: cargo build -p luna-aot --release
      - name: compile fib.lua for ${{ matrix.target }}
        run: |
          cat > /tmp/fib.lua <<'EOF'
          local function fib(n)
            if n < 2 then return n end
            return fib(n-1) + fib(n-2)
          end
          return fib(20)
          EOF
          # The link step may fail without the cross-linker on the
          # GH runner; capture exit but record whether codegen ran.
          ./target/release/luna-aot compile /tmp/fib.lua \
            --target ${{ matrix.target }} \
            --out /tmp/fib-${{ matrix.target }} \
            || echo "link skipped (no cross-cc for ${{ matrix.target }} on runner)"
      - name: report
        if: always()
        run: |
          if [ -f "/tmp/fib-${{ matrix.target }}" ]; then
            echo "✓ ${{ matrix.target }} produced binary"
            file /tmp/fib-${{ matrix.target }}
            ls -l /tmp/fib-${{ matrix.target }}
          else
            echo "ℹ ${{ matrix.target }} codegen-only (link skipped)"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Wine MinGW PE actual-run: build a Windows .exe via MinGW
  # cross-toolchain on a Linux host, then run it under Wine. This
  # closes the audit AO R3 niche follow-up (Wine MinGW PE actual-run
  # verification) that v1.3 only verified at the product-structure
  # level.
  # ─────────────────────────────────────────────────────────────────
  wine-mingw-pe-run:
    name: Wine MinGW PE actual-run
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: install MinGW + Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 wine64
      - name: cargo build -p luna-aot
        run: cargo build -p luna-aot --release
        # Kept so a compile error surfaces as its own step; the compile
        # below goes through `cargo run` for the reason explained there.

      # v2.20 D5: cross-compiling needs luna-aot to run *inside* the
      # workspace, not as a standalone binary.
      #
      # `LUNA_AOT_RUNTIME_HELPERS_STATICLIB` is honoured only for host
      # builds — `build_runtime_helpers_staticlib` gates it on
      # `target_triple.is_none()`, deliberately, so a cross link cannot
      # be handed a staticlib built for the wrong ABI. For a cross
      # target it always builds its own, which means it needs
      # CARGO_MANIFEST_DIR to find the workspace. That variable is set
      # by cargo at compile time and is absent when the binary is
      # invoked directly, so `./target/release/luna-aot --target ...`
      # can never work:
      #   luna-aot: linker failed: CARGO_MANIFEST_DIR not set
      #
      # (That is why the Alpine job's fix does not transfer: it builds
      # natively inside the container, so it is a host build and the
      # override applies.)
      #
      # Running through `cargo run` puts CARGO_MANIFEST_DIR back and
      # lets luna-aot build the windows-gnu staticlib itself.
      - name: compile hello.lua → hello.exe
        run: |
          set -eu
          cat > /tmp/hello.lua <<'EOF'
          print("hello from luna-aot via wine")
          return 42
          EOF
          cargo run -p luna-aot --release -- compile /tmp/hello.lua \
            --target x86_64-pc-windows-gnu \
            --out /tmp/hello.exe
          test -f /tmp/hello.exe || { echo "luna-aot produced no .exe"; exit 1; }
          file /tmp/hello.exe
          file /tmp/hello.exe | grep -q 'PE32+' || { echo "not a PE32+ binary"; exit 1; }

      - name: run hello.exe under wine
        env:
          WINEDEBUG: "-all"
        run: |
          set -u
          # Exit-code propagation through wine varies by version, so the
          # assertion is on the program's OUTPUT, not its status. The old
          # form (`wine ... || (echo ... && true)`) could not fail at all,
          # which is how this job stayed "meaningful" while the compile
          # step above had been broken the whole time.
          OUT=$(wine /tmp/hello.exe 2>&1) || true
          echo "$OUT"
          case "$OUT" in
            *"hello from luna-aot via wine"*) echo "PE ran under wine, output matches" ;;
            *) echo "::error::hello.exe did not produce the expected output under wine"; exit 1 ;;
          esac

  # ─────────────────────────────────────────────────────────────────
  # Alpine musl native E2E: in a real Alpine container (rather than
  # the GH runner's glibc), build + run a luna-aot binary against
  # musl directly. Closes the v1.3 niche follow-up "Alpine musl
  # native E2E (needs brew install musl-cross)" — on CI we use
  # docker not brew, so it's the right environment for the test.
  # ─────────────────────────────────────────────────────────────────
  alpine-musl-e2e:
    name: Alpine musl native E2E
    runs-on: ubuntu-latest
    # v2.20 D5: soft-fail removed. This job had been failing silently for
    # an unknown stretch behind `continue-on-error`; after the git,
    # image and staticlib fixes it has been observed green twice (runs
    # 31793374064 and 31794199111). Per the arc rule adopted in v2.17, a
    # gate counts once it can fail — so now it can.
    container:
      # v2.20 D5: was `rust:1.86-alpine`. luna needs 1.88+ (edition-2024
      # let-chains), and since v2.17 declares no MSRV the promise is
      # "builds on current stable" — so track stable rather than pin a
      # version that cannot build the tree.
      image: rust:alpine
    steps:
      # v2.20 D5: the alpine image ships without git, so actions/checkout
      # fell back to the REST API download path, which does not support
      # `submodules` — the job failed at checkout before compiling
      # anything:
      #   Input 'submodules' not supported when falling back to download
      #   using the GitHub REST API
      # It had been failing that way silently, masked by
      # continue-on-error. Install git first so checkout takes the real
      # git path and the vendored cranelift submodule lands.
      - name: install git (the alpine image ships without it)
        run: apk add --no-cache git
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: install build deps
        run: apk add --no-cache musl-dev gcc make
      - name: cargo build -p luna-aot
        run: cargo build -p luna-aot --release --target x86_64-unknown-linux-musl

      # v2.20 D5: `luna-aot` normally locates the workspace via
      # CARGO_MANIFEST_DIR and builds the runtime-helpers staticlib on
      # demand. That variable is a *compile-time* cargo thing and is
      # absent when the binary runs standalone, so the link step failed:
      #   luna-aot: linker failed: CARGO_MANIFEST_DIR not set — cannot
      #   locate workspace to build luna-runtime-helpers.
      # The error names its own escape hatch. Build the staticlib for the
      # same target first and point at it.
      - name: build the runtime-helpers staticlib (musl)
        run: cargo build -p luna-runtime-helpers --release --target x86_64-unknown-linux-musl

      - name: compile + run hello.lua
        run: |
          set -eu
          STATICLIB="$PWD/target/x86_64-unknown-linux-musl/release/libluna_runtime_helpers.a"
          test -f "$STATICLIB" || { echo "staticlib missing at $STATICLIB"; ls -l target/x86_64-unknown-linux-musl/release/ | head -20; exit 1; }
          export LUNA_AOT_RUNTIME_HELPERS_STATICLIB="$STATICLIB"
          echo "using staticlib: $STATICLIB"
          cat > /tmp/hello.lua <<'EOF'
          print("hello from luna-aot on alpine musl")
          return 7
          EOF
          ./target/x86_64-unknown-linux-musl/release/luna-aot compile /tmp/hello.lua --out /tmp/hello
          test -x /tmp/hello || { echo "luna-aot produced no executable"; exit 1; }
          OUT=$(/tmp/hello) ; RC=$?
          echo "output: $OUT"
          echo "exit:   $RC"
          case "$OUT" in
            *"hello from luna-aot on alpine musl"*) echo "E2E ok" ;;
            *) echo "unexpected output"; exit 1 ;;
          esac
