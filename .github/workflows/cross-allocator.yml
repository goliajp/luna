# Cross-allocator matrix.
#
# Some UAFs only reproduce under Linux glibc — macOS (Apple-malloc)
# and Linux + jemalloc pass the same Lua test. Different allocators expose different UAF shapes because their
# free-list / quarantine / coalescing behavior decides whether a
# freed object's bytes get reused for an adjacent-sized
# allocation vs sit quarantined.
#
# Approach: LD_PRELOAD-swap the global allocator under each
# matrix entry, run the full official_run + the UAF
# regression tests. No code change in luna-* crates: keeps the
# 0-third-party-dep luna-core contract intact. jemalloc comes from
# apt-get, mimalloc from a pinned source build; the LD_PRELOAD wire-up replaces
# `malloc` / `free` / etc. for the cargo-test child process.
#
# Why this catches things ASAN doesn't: ASAN's quarantine model
# is uniform (not glibc / jemalloc / mimalloc shapes), so a UAF
# that surfaces under glibc but is silently masked under jemalloc
# would still pass ASAN. Running the actual production allocators
# end-to-end is the only way to catch this class.

name: cross-allocator

on:
  schedule:
    # Nightly at 05:00 UTC — staggered after asan.yml (03:00) +
    # miri.yml (04:00) so the runners aren't queued behind each
    # other.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  cross-allocator:
    name: ${{ matrix.allocator }} (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # both mimalloc lines: v2 is upstream's stable legacy line (the rust
        # mimalloc crate's `v2` feature), v3 its recommended release
        allocator: [glibc, jemalloc, mimalloc-v2, mimalloc-v3]
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
      CI: 1  # Match the CI byte-strip sort.lua AA gate in
             # official_run.rs.
    steps:
      - uses: actions/checkout@v7
        with:
          # scheduled runs start on the default branch (master, the last
          # release); test the code that is about to ship instead
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install allocator library
        run: |
          set -euo pipefail
          case "${{ matrix.allocator }}" in
            glibc)
              # Default. No-op.
              ;;
            jemalloc)
              sudo apt-get update -qq
              sudo apt-get install -y -qq libjemalloc2
              echo "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2" >> "$GITHUB_ENV"
              ;;
            mimalloc-v2|mimalloc-v3)
              # built from pinned releases: the apt package is libmimalloc2.0
              # (2.1) on ubuntu 24.04 and libmimalloc3 (3.2) on 26.04, so it
              # would change with the runner image
              if [ "${{ matrix.allocator }}" = mimalloc-v2 ]; then
                VER=2.5.2 SHA=2406cc5f3ab6d6e54fe560cdd66fa46eee775312
              else
                VER=3.5.3 SHA=d4881d338125e1cb7c47ba4cfb398d6f7c0c8d45
              fi
              git init -q /tmp/mimalloc && cd /tmp/mimalloc
              git fetch -q --depth 1 https://github.com/microsoft/mimalloc.git "$SHA"
              git checkout -q FETCH_HEAD
              cmake -S . -B out -DCMAKE_BUILD_TYPE=Release \
                -DMI_BUILD_TESTS=OFF -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
              cmake --build out -j"$(nproc)"
              LIB=$(readlink -f out/libmimalloc.so)
              GOT=$(MIMALLOC_VERBOSE=1 LD_PRELOAD="$LIB" /bin/true 2>&1 | grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+, ' || true)
              if [ "$GOT" != "v$VER, " ]; then
                echo "::error::expected mimalloc v$VER from $LIB, got: '$GOT'"
                exit 1
              fi
              echo "mimalloc pin OK: v$VER ($LIB)"
              echo "LD_PRELOAD=$LIB" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Show active allocator
        run: |
          echo "matrix=${{ matrix.allocator }}"
          echo "LD_PRELOAD=$LD_PRELOAD"
          # Confirm preload is plumbed: a tiny C program runs malloc
          # and we check via mallinfo or symbol export. Cheaper:
          # invoke `LD_DEBUG=libs ls` and grep for the lib.
          if [[ -n "$LD_PRELOAD" ]]; then
            LD_DEBUG=libs ls /dev/null 2>&1 | grep -E "(jemalloc|mimalloc)" | head -3 || true
          fi

      - name: cargo build --workspace
        # Exclude LLVM-backed alt-backend crates that need system
        # LLVM 18 + Polly which hosted ubuntu-latest doesn't ship
        # (matches ci.yml's `native` job exclusions). Without these
        # excludes the build fails with `error: could not find native
        # static library `Polly``.
        run: cargo build --workspace --all-targets --exclude llvm-jit-probe --exclude luna-jit-llvm

      - name: cargo test --workspace --release (official_run + regressions)
        # Cap the scope to luna-core for the matrix (where the UAFs
        # surfaced). The official_run integration test exercises the full PUC
        # suite per dialect, which is the broadest end-to-end
        # signal we have.
        # two invocations: libtest name filters would also apply to official_run
        run: |
          cargo test --release -p luna-core --test official_run -- --nocapture
          cargo test --release -p luna-core --test it -- --nocapture \
            toomanyidx_memory_cap:: \
            sort_gc_during_compare:: \
            gc_finalizer_edges:: \
            host_roots_slot_recycling::
