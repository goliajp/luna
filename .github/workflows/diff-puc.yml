# v2.2 Phase 5 (DP) — differential vs PUC lua-5.5 harness.
#
# luna's official_run test is "luna alone runs PUC's chunk to
# completion under our wrapper". This is necessary but not
# sufficient: luna could be silently producing different output
# (different number formatting, different error message text,
# different print order) and still "pass". The next quality
# layer is end-to-end byte-diff against PUC's own lua-5.5
# binary executing the same source.
#
# v2.2 ships the harness on 5 deterministic programs (no
# os.time / math.random / io non-determinism). v2.3+ expands
# to fuzz-driven inputs and the full PUC official suite.
#
# Why nightly + workflow_dispatch only: PUC builds from source
# each run (~30s) + the lua-5.5 source tarball needs to be
# downloaded. Acceptable for nightly; too expensive for per-PR.
# Once v2.3 lands fuzz infrastructure that ALSO needs PUC, the
# build step can be cached + the diff job can move to per-PR.

name: diff-puc

on:
  schedule:
    # Nightly at 06:00 UTC — staggered after the earlier nightly
    # jobs.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  diff-puc:
    name: luna-vs-PUC 5.5 byte-diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build PUC 5.1.5 / 5.2.4 / 5.3.6 / 5.4.8 (dialect matrix)
        # v2.14 HD — the harness diffs every tests/diff_puc/5.x/
        # subtree against the matching interpreter. `make posix`
        # avoids the readline dependency (the harness feeds stdin);
        # each version's Makefile has the posix target.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          mkdir -p /tmp/puc-multi && cd /tmp/puc-multi
          for v in 5.1.5 5.2.4 5.3.6 5.4.8; do
            curl -fsSL "https://www.lua.org/ftp/lua-$v.tar.gz" | tar -xz
            ( cd "lua-$v" && make posix > /dev/null )
          done
          echo "PUC_LUA_51=/tmp/puc-multi/lua-5.1.5/src/lua" >> "$GITHUB_ENV"
          echo "PUC_LUA_52=/tmp/puc-multi/lua-5.2.4/src/lua" >> "$GITHUB_ENV"
          echo "PUC_LUA_53=/tmp/puc-multi/lua-5.3.6/src/lua" >> "$GITHUB_ENV"
          echo "PUC_LUA_54=/tmp/puc-multi/lua-5.4.8/src/lua" >> "$GITHUB_ENV"

      - name: Show dialect interpreter versions
        run: |
          $PUC_LUA_51 -v && $PUC_LUA_52 -v && $PUC_LUA_53 -v && $PUC_LUA_54 -v

      - name: Install PUC lua-5.5.1 (build from source)
        # v2.18 P1: pinned to 5.5.1 (released 2026-07-24), superseding
        # 5.5.0. The pin is exact and the build is always from source.
        #
        # The previous version tried `apt-get install lua5.5` first and
        # only fell back to source. That made the differential basis
        # depend on whatever the runner image happened to ship, which is
        # the same class of problem as an unpinned reference: the
        # comparison silently changes when the image updates. Arc
        # charter §2.5 calls for build-from-source pinned to the vendored
        # suite version, so the apt path is gone.
        #
        # The version assertion below exists so this step can FAIL. A
        # pin nobody checks is not a pin (v2.17 gate-audit lesson).
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          mkdir -p /tmp/puc-build && cd /tmp/puc-build
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o lua.tar.gz
          tar -xzf lua.tar.gz
          cd lua-5.5.1
          # 5.5 dropped the 5.4-era `linux-readline` target; plain
          # `linux` builds without readline, which the stdin-driven
          # diff harness doesn't need anyway.
          make linux
          sudo make install INSTALL_TOP=/usr/local
          echo "PUC_LUA=/usr/local/bin/lua" >> "$GITHUB_ENV"
          echo "PUC_LUA_55=/usr/local/bin/lua" >> "$GITHUB_ENV"

      - name: Assert the 5.5 interpreter is exactly 5.5.1
        run: |
          set -euo pipefail
          GOT=$(/usr/local/bin/lua -v 2>&1)
          case "$GOT" in
            "Lua 5.5.1"*) echo "PUC 5.5 pin OK: $GOT" ;;
            *) echo "::error::expected Lua 5.5.1, got: $GOT"; exit 1 ;;
          esac

      - name: Show PUC version
        run: $PUC_LUA -v

      - name: Build luna-tools (luna binary for diff runs)
        # diff_puc invokes luna via cargo test, NOT via a
        # standalone binary — the luna-side harness uses the
        # in-process Vm::eval API. PUC side uses $PUC_LUA.
        # luna-tools build is just to confirm the workspace
        # compiles cleanly under the diff job env. Same LLVM
        # excludes as ci.yml — llvm-jit-probe + luna-jit-llvm
        # need system LLVM 18 + Polly, absent on hosted runners.
        run: cargo build --workspace --release --exclude llvm-jit-probe --exclude luna-jit-llvm

      - name: cargo test --release -p luna-core --test diff_puc
        # The diff_puc integration test reads each fixture from
        # tests/diff_puc/*.lua, runs it on $PUC_LUA, runs it
        # via luna's Vm::eval, normalizes both outputs, and
        # asserts byte-equality. Failures dump both outputs +
        # the normalized diff for triage.
        run: cargo test --release -p luna-core --test diff_puc -- --nocapture
