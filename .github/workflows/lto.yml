name: lto

# The per-push matrix in ci.yml tests with LTO off to keep it fast. This runs
# the same suite built as shipped (`[profile.release]`, fat LTO) on every
# platform, alongside it: nothing waits on it during development, and a
# release needs it green.
on:
  push:
    branches: [master, develop]
    paths-ignore: ['**/*.md', 'docs/**', 'web/**']
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  native:
    name: ${{ matrix.os }} release (lto)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scheduled runs start on the default branch (master, the last
          # release); test the code that is about to ship instead
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # the AOT tests build and run both Windows targets natively: MSVC
      # (cl.exe / link.exe found in the Visual Studio install) and MinGW
      # (the runner's C:\mingw64 gcc)
      - name: rustup target add x86_64-pc-windows-gnu
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - name: cargo test --workspace --release
        run: cargo test --workspace --release --exclude llvm-jit-probe --exclude luna-jit-llvm -- --nocapture
