# Records what PUC built with MSVC prints for the scripts the CLI step
# tests run (`crates/luna-jit/tests/gc_steps`, `tests/lua_c` and
# `tests/package_paths`, with no LUA_PATH or LUA_CPATH set), under
# the tests' conditions: the string hash seed fixed at 1 (the same patch
# as the Linux recordings' PUC), the interpreter at C:\luna-gc-steps\lua.exe
# started through `cmd` as `lua`, from the scripts' directory, TZ=UTC. The
# outputs, CRLF read as LF, are uploaded as the artifact `windows-steps`,
# with what `crates/luna-core/tests/windows_counts/host.c`, built with
# each PUC (without the coincidences of addresses) and run from the same
# directory, prints for the count tests of luna-core
# (`windows_counts/<dialect>.windows.out`).
# Run by hand when a script or a recording changes.

name: record-windows-steps

on:
  workflow_dispatch:

jobs:
  record:
    name: record with MSVC-built PUC
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Fetch PUC 5.1.5 / 5.2.4 / 5.3.6 / 5.4.9 / 5.5.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/puc" && cd "$RUNNER_TEMP/puc"
          for v in 5.1.5 5.2.4 5.3.6 5.4.9 5.5.1; do
            curl -fsSL "https://www.lua.org/ftp/lua-$v.tar.gz" -o "lua-$v.tar.gz"
          done
          echo "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce  lua-5.5.1.tar.gz" | sha256sum -c -
          for v in 5.1.5 5.2.4 5.3.6 5.4.9 5.5.1; do tar -xzf "lua-$v.tar.gz"; done

      - name: Fix the hash seed
        shell: python
        run: |
          import os, re
          seed = ('  { const char *r38s = getenv("LUNA_GC_SEED"); '
                  'if (r38s) return (unsigned int)strtoul(r38s, NULL, 0); }\n')
          head = re.compile(r"\n(static unsigned int makeseed \(lua_State \*L\)"
                            r"|static unsigned int luai_makeseed \(lua_State \*L\)"
                            r"|LUALIB_API unsigned int luaL_makeseed \(lua_State \*L\)) \{\n")
          root = os.path.join(os.environ["RUNNER_TEMP"], "puc")
          for v in ("5.2.4", "5.3.6", "5.4.9", "5.5.1"):
              src = os.path.join(root, f"lua-{v}", "src")
              done = 0
              for name in os.listdir(src):
                  if not name.endswith(".c"):
                      continue
                  p = os.path.join(src, name)
                  s = open(p, newline="").read()
                  m = head.search(s)
                  if m:
                      s = "#include <stdlib.h>\n" + s[:m.end()] + seed + s[m.end():]
                      open(p, "w", newline="").write(s)
                      done += 1
              assert done == 1, f"{v}: {done} seed functions patched"

      # luna counts as if two C strings never met in a bucket of luaS_new's
      # cache (5.3 on), and as if a new key never took the node of a
      # removed key hashed by its address: both depend on where the
      # compiler and the allocator put things. The count host's PUC (a copy
      # of the sources) gets a bucket for each C string address, and counts
      # such a node as taken; the registry keys it makes of static
      # addresses take the fixed values luna gives them
      - name: Take the coincidences of addresses out of the count host's PUC
        shell: python
        run: |
          import os, re, shutil
          root = os.path.join(os.environ["RUNNER_TEMP"], "puc")
          private = """#define NOCOIN_N 8192
          static const char *nocoin_k[NOCOIN_N];
          static TString *nocoin_v[NOCOIN_N][STRCACHE_M];
          static TString **nocoin_bucket (lua_State *L, const char *str) {
            unsigned int h = point2uint(str) % NOCOIN_N;
            int j;
            while (nocoin_k[h] != NULL && nocoin_k[h] != str) h = (h + 1) % NOCOIN_N;
            if (nocoin_k[h] == NULL) {
              nocoin_k[h] = str;
              for (j = 0; j < STRCACHE_M; j++) nocoin_v[h][j] = G(L)->memerrmsg;
            }
            return nocoin_v[h];
          }
          """.replace("\n          ", "\n")
          clear = ("  { int h; for (h = 0; h < NOCOIN_N; h++) if (nocoin_k[h] != NULL)"
                   " for (j = 0; j < STRCACHE_M; j++) if (iswhite(nocoin_v[h][j]))"
                   " nocoin_v[h][j] = g->memerrmsg; }\n")
          reuse = re.compile(r"\n  if \((!ttisnil|!isempty)\(gval\(mp\)\) \|\| (mp == dummynode|isdummy\(mp\)|isdummy\(t\))\) \{")
          for v in ("5.1.5", "5.2.4", "5.3.6", "5.4.9", "5.5.1"):
              src = os.path.join(root, f"lua-{v}", "src")
              dst = os.path.join(root, f"lua-{v}", "src-host")
              shutil.copytree(src, dst)
              p = os.path.join(dst, "lstring.c")
              s = open(p, newline="").read()
              if "STRCACHE_N" in s:
                  head = re.search(r"void luaS_clearcache \(global_State \*g\) \{\n  int i, j;\n", s)
                  assert head, f"{v}: luaS_clearcache"
                  s = s[:head.start()] + private + s[head.start():head.end()] + clear + s[head.end():]
                  old = "  TString **p = G(L)->strcache[i];"
                  assert old in s, f"{v}: luaS_new's bucket"
                  s = s.replace(old, "  TString **p = nocoin_bucket(L, str);", 1)
                  # the buckets are the state's: a new state starts with none
                  init = "void luaS_init (lua_State *L) {\n"
                  assert init in s, f"{v}: luaS_init"
                  s = s.replace(init, init + "  memset(nocoin_k, 0, sizeof nocoin_k);\n", 1)
                  open(p, "w", newline="").write(s)
              p = os.path.join(dst, "ltable.c")
              s = open(p, newline="").read()
              by_addr = "(!ttisnumber(key) && !ttisboolean(key) && !ttisstring(key))"
              if "keyisnil" in s:
                  nilkey, dead = "!keyisnil(mp)", "keyisdead(mp)"
                  old_addr = ("(!keyisdead(mp) && ((keyiscollectable(mp) && novariant(keytt(mp)) != LUA_TSTRING)"
                              " || keytt(mp) == LUA_VLIGHTUSERDATA))")
              else:
                  nilkey, dead = "!ttisnil(gkey(mp))", "(ttype(gkey(mp)) == LUA_TDEADKEY)"
                  old_addr = ("(ttype(gkey(mp)) != LUA_TDEADKEY && !ttisnumber(gkey(mp))"
                              " && !ttisboolean(gkey(mp)) && !ttisstring(gkey(mp)))")
              def taken(m):
                  empty = "isempty(gval(mp))" if m.group(1) == "!isempty" else "ttisnil(gval(mp))"
                  return (f"\n  if ({m.group(1)}(gval(mp)) || {m.group(2)} || ({empty} && {nilkey}"
                          f" && ({dead} || {by_addr} || {old_addr}))) {{")
              s, n = reuse.subn(taken, s, count=1)
              assert n == 1, f"{v}: luaH_newkey's main position test"
              open(p, "w", newline="").write(s)
              for name in ("ldblib.c", "loadlib.c"):
                  p = os.path.join(dst, name)
                  s = open(p, newline="").read()
                  for key, fixed in (("(void *)&KEY_HOOK", "0x1020"), ("&HOOKKEY", "0x1020"), ("&CLIBS", "0x1010")):
                      s = s.replace(f", {key})", f", (void *){fixed})")
                  open(p, "w", newline="").write(s)

      - name: Build with MSVC
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set > "%RUNNER_TEMP%\vcvars.env"
          for %%v in (5.1.5 5.2.4 5.3.6 5.4.9 5.5.1) do (
            pushd "%RUNNER_TEMP%\puc\lua-%%v\src" || exit /b 1
            del luac.c
            if exist onelua.c del onelua.c
            set DEFS=
            if "%%v"=="5.2.4" set DEFS=/DLUA_COMPAT_ALL
            if "%%v"=="5.3.6" set DEFS=/DLUA_COMPAT_5_2
            if "%%v"=="5.4.9" set DEFS=/DLUA_COMPAT_5_3
            call cl /nologo /O2 /MD /W0 !DEFS! /Fe:..\lua.exe *.c || exit /b 1
            popd
            pushd "%RUNNER_TEMP%\puc\lua-%%v\src-host" || exit /b 1
            del lua.c luac.c
            if exist onelua.c del onelua.c
            call cl /nologo /O2 /MD /W0 !DEFS! /I. /Fe:..\host.exe "%GITHUB_WORKSPACE%\crates\luna-core\tests\windows_counts\host.c" *.c || exit /b 1
            del host.obj
            call lib /nologo /OUT:..\puc.lib *.obj || exit /b 1
            popd
          )

      - name: Record
        shell: python
        run: |
          import os, shutil, subprocess
          root = os.path.join(os.environ["RUNNER_TEMP"], "puc")
          versions = {"5.1": "5.1.5", "5.2": "5.2.4", "5.3": "5.3.6", "5.4": "5.4.9", "5.5": "5.5.1"}
          bin_dir = r"C:\luna-gc-steps"
          os.makedirs(bin_dir, exist_ok=True)
          env = dict(os.environ, LUNA_GC_SEED="1", TZ="UTC")
          for k in [k for k in env if k.upper().startswith(("LUA_PATH", "LUA_CPATH", "LUA_INIT"))]:
              del env[k]
          env["PATH"] = bin_dir + os.pathsep + env["PATH"]
          out_root = os.path.join(os.environ["RUNNER_TEMP"], "windows-steps")
          for base in ("gc_steps", "lua_c", "package_paths"):
              scripts = os.path.join("crates", "luna-jit", "tests", base)
              for d in sorted(os.listdir(scripts)):
                  for name in sorted(os.listdir(os.path.join(scripts, d))):
                      if not name.endswith(".lua"):
                          continue
                      shutil.copy(os.path.join(root, f"lua-{versions[d]}", "lua.exe"),
                                  os.path.join(bin_dir, "lua.exe"))
                      r = subprocess.run(["cmd", "/C", "lua", f"{d}/{name}"], cwd=scripts,
                                         env=env, capture_output=True)
                      out = r.stdout.replace(b"\r\n", b"\n")
                      dest = os.path.join(out_root, base, d, name[:-4] + ".windows.out")
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      open(dest, "wb").write(out)
                      linux = os.path.join(scripts, d, name[:-4] + ".out")
                      same = os.path.exists(linux) and open(linux, "rb").read() == out
                      print(f"{base}/{d}/{name} exit {r.returncode}", "same as Linux" if same else "own")
          chunk = ('local t, out = {}, {} for i = 1, 2000 do t[i] = {i} '
                   'if i % 250 == 0 then out[#out + 1] = math.floor(collectgarbage("count") * 1024) end '
                   'end return table.concat(out, " ")')
          unload = "for k in pairs(package.loaded) do package.loaded[k] = nil end"
          runs = [("running", chunk), ("reopen", ""), ("noreopen", ""), ("reopen", unload), ("noreopen", unload)]
          for d, v in versions.items():
              host = os.path.join(bin_dir, "host.exe")
              shutil.copy(os.path.join(root, f"lua-{v}", "host.exe"), host)
              out = b""
              for mode, arg in runs:
                  r = subprocess.run([host, mode, arg], env=env, capture_output=True)
                  assert r.returncode == 0, (d, mode, r.stdout, r.stderr)
                  out += r.stdout.replace(b"\r\n", b"\n")
              dest = os.path.join(out_root, "windows_counts", f"{d}.windows.out")
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              open(dest, "wb").write(out)
              print(f"windows_counts/{d}:", out.decode())
              # the allocations of a second luaL_openlibs with package.loaded
              # emptied, and of none, for comparing with luna's trace
              logs = os.path.join(out_root, "windows_counts_alloc", d)
              os.makedirs(logs, exist_ok=True)
              for mode in ("reopen", "noreopen"):
                  log = dict(env, HOST_ALLOC_LOG=os.path.join(logs, f"{mode}.log"))
                  r = subprocess.run([host, mode, unload], env=log, capture_output=True)
                  assert r.returncode == 0, (d, mode, r.stdout, r.stderr)

      # the C API hosts of luna-jit's tests (`tests/capi`), built with the
      # same PUC and the defines the tests give luna's, run from
      # C:\luna-gc-steps as the tests run luna's, from the crate directory;
      # and the CLI case `cli_errors::libraries_and_warnings::library_error`
      - name: Record the C API hosts and the CLI cases
        shell: python
        run: |
          import os, shutil, subprocess, tempfile
          root = os.path.join(os.environ["RUNNER_TEMP"], "puc")
          env = {}
          for line in open(os.path.join(os.environ["RUNNER_TEMP"], "vcvars.env"), errors="replace"):
              if "=" in line:
                  k, v = line.rstrip("\n").split("=", 1)
                  env[k] = v
          for k in [k for k in env if k.upper().startswith(("LUA_PATH", "LUA_CPATH", "LUA_INIT"))]:
              del env[k]
          # one PATH, whatever case `set` printed it in; the compiler found on
          # it here, as this process's own PATH is not the one given to cl
          path = next(v for k, v in env.items() if k.upper() == "PATH")
          for k in [k for k in env if k.upper() == "PATH"]:
              del env[k]
          env["PATH"] = path
          cl = shutil.which("cl", path=path)
          assert cl, "cl on the Visual Studio PATH"
          bin_dir = r"C:\luna-gc-steps"
          out_root = os.path.join(os.environ["RUNNER_TEMP"], "windows-steps")
          crate = os.path.join(os.getcwd(), "crates", "luna-jit")
          capi = os.path.join(crate, "tests", "capi")
          expected = os.path.join(capi, "expected")
          versions = {"51": "5.1.5", "52": "5.2.4", "53": "5.3.6", "54": "5.4.9", "55": "5.5.1"}
          import concurrent.futures, datetime, sys

          def say(text):
              print(datetime.datetime.now().strftime("%H:%M:%S"), text, flush=True)

          def record(name, v, ver):
              """build host `name` against PUC `ver` and run it (a minute at
              most): what it printed, or why there is nothing"""
              src = os.path.join(root, f"lua-{ver}", "src-host")
              exe = os.path.join(bin_dir, f"capi-{name}-{v}.exe")
              obj = tempfile.mkdtemp()
              t0 = datetime.datetime.now()
              r = subprocess.run([cl, "/nologo", "/w", "/O2", "/MD", "/DLUA_COMPAT_ALL",
                                  "/DLUA_COMPAT_5_2", "/DLUA_COMPAT_5_3", f"/I{src}", f"/I{capi}",
                                  os.path.join(capi, name + ".c"), f"/Fe{exe}", f"/Fo{obj}\\",
                                  os.path.join(root, f"lua-{ver}", "puc.lib")],
                                 env=env, capture_output=True)
              built = (datetime.datetime.now() - t0).total_seconds()
              if r.returncode != 0:
                  return f"capi/{name}.{v}: not built ({built:.0f}s)"
              t0 = datetime.datetime.now()
              try:
                  r = subprocess.run([exe], cwd=crate, env=env, capture_output=True, timeout=60)
              except subprocess.TimeoutExpired:
                  return f"capi/{name}.{v}: ran out of its minute (built in {built:.0f}s)"
              ran = (datetime.datetime.now() - t0).total_seconds()
              code = r.returncode
              status = "abort" if code in (3, 0xC0000409, -1073740791) else str(code)
              dest = os.path.join(out_root, "capi")
              os.makedirs(dest, exist_ok=True)
              out = r.stdout.replace(b"\r\n", b"\n")
              err = r.stderr.replace(b"\r\n", b"\n")
              open(os.path.join(dest, f"{name}.{v}.windows.out"), "wb").write(out)
              open(os.path.join(dest, f"{name}.{v}.windows.err"), "wb").write(err)
              open(os.path.join(dest, f"{name}.{v}.windows.status"), "w").write(status + "\n")
              linux = os.path.join(expected, f"{name}.{v}.out")
              same = open(linux, "rb").read().replace(b"\r\n", b"\n") == out
              return (f"capi/{name}.{v} status {status} {'same as Linux' if same else 'own'}"
                      f" (built {built:.0f}s, ran {ran:.1f}s)")

          jobs = [(f[:-2], v, ver) for f in sorted(os.listdir(capi)) if f.endswith(".c")
                  for v, ver in versions.items()
                  if os.path.exists(os.path.join(expected, f"{f[:-2]}.{v}.out"))]
          say(f"{len(jobs)} hosts to record")
          with concurrent.futures.ThreadPoolExecutor(4) as pool:
              for line in pool.map(lambda j: record(*j), jobs):
                  say(line)
          cli = {"5.1": "5.1.5", "5.2": "5.2.4", "5.3": "5.3.6", "5.4": "5.4.9", "5.5": "5.5.1"}
          env["PATH"] = bin_dir + os.pathsep + path
          env["TZ"] = "UTC"
          for d, ver in cli.items():
              shutil.copy(os.path.join(root, f"lua-{ver}", "lua.exe"), os.path.join(bin_dir, "lua.exe"))
              work = tempfile.mkdtemp()
              open(os.path.join(work, "errmod.lua"), "w").write('error("in module")\n')
              r = subprocess.run(["cmd", "/C", "lua", "-l", "errmod"], cwd=work, env=env, capture_output=True)
              dest = os.path.join(out_root, "cli")
              os.makedirs(dest, exist_ok=True)
              err = r.stderr.replace(b"\r\n", b"\n")
              open(os.path.join(dest, f"library_error.{d}.windows.err"), "wb").write(err)
              say(f"cli/library_error {d} exit {r.returncode} stdout {r.stdout!r}: " + err.decode(errors="replace"))

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-steps
          path: ${{ runner.temp }}/windows-steps
