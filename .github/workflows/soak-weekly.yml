# Long-soak sample.
#
# Runs `luna-soak` against each workload fixture and captures the JSON
# metrics report as a workflow artifact.
#
# The soak asks for a duration it can actually finish inside the
# runner cap, so a healthy run ends `success` and a red run means a
# real failure. A job whose steady state is red (e.g. a 24h soak killed
# by the timeout every time) carries no signal when something actually
# breaks. A single 24h run is structurally impossible on hosted
# runners; capped samples add up to the long-run evidence instead.

name: soak-weekly

# Manual only: burning ~5.5h of runner on a timer re-derives settled
# results. Run it on demand — before a release, after a GC or allocator
# change, or when investigating a suspected leak.
on:
  workflow_dispatch:

env:
  # 5h30m of actual soak. Budget against `timeout-minutes: 350`:
  #   release build ~5 min + soak 330 min + upload ~1 min ≈ 336 min,
  # leaving ~14 min of headroom. Raise both numbers together, and keep
  # the headroom — the job must finish on its own rather than being
  # killed.
  SOAK_SECONDS: "19800"

jobs:
  soak-weekly:
    name: soak ${{ matrix.workload }} (5h30m capped sample)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - workload: token_bucket_1k
            args: ""
          # a fresh JIT Vm per iteration, dropped once both JITs compiled
          # code: what a dropped Vm keeps (machine code, heap) shows as RSS
          # growth, and growth past 1% in the second half fails the job
          - workload: vm_churn
            args: --vm-churn --max-second-half-rss-drift-pct 1
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release -p luna-tools --bin luna-soak
        run: cargo build --release -p luna-tools --bin luna-soak
      - name: long soak — ${{ matrix.workload }}
        run: |
          ./target/release/luna-soak \
            --workload crates/luna-tools/workloads/${{ matrix.workload }}.lua \
            --duration "$SOAK_SECONDS" \
            --interval 300 \
            ${{ matrix.args }} \
            --out soak-${{ matrix.workload }}-5h30m.json
      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-weekly-${{ matrix.workload }}
          path: soak-${{ matrix.workload }}-5h30m.json
          retention-days: 90
