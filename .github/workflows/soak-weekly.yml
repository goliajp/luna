# v2.4 Phase Soak — weekly long-soak sample.
#
# Runs `luna-soak` against each workload fixture and captures the JSON
# metrics report as a workflow artifact.
#
# v2.17 H6 — this job used to ask for a 24h soak (`--duration 86400`)
# against a 350-minute `timeout-minutes`, so GitHub killed it every
# single week: 11 runs, 11 `cancelled`, zero `success`. The artifact was
# still produced (v2.12 made luna-soak write incrementally, and the
# upload step is `if: always()`), so the DATA was fine — but a job whose
# steady state is red carries no signal when something actually breaks,
# and in practice nobody read the reports: five samples had accumulated
# unanalysed by 2026-08.
#
# The soak now asks for a duration it can actually finish inside the
# runner cap, so a healthy week ends `success` and a red run means a
# real failure. This does not change what is measured — arc charter §1
# #3 was closed (2026-07-03 amendment) on the "4 clean capped samples
# ≈ 24h cumulative" form precisely because a single 24h run is
# structurally impossible on hosted runners. These weekly samples are
# ongoing corroboration of that closed criterion.

name: soak-weekly

# Manual only (2026-08-14). Soak is no longer on a timer: acceptance #3
# closed on four named capped runs from v2.13, which are historical
# facts and do not decay, so nothing is served by burning ~5.5h of
# runner every week to re-derive them. Run it on demand — before a
# release, after a GC or allocator change, or when investigating a
# suspected leak.
on:
  workflow_dispatch:

env:
  # 5h30m of actual soak. Budget against `timeout-minutes: 350`:
  #   release build ~5 min + soak 330 min + upload ~1 min ≈ 336 min,
  # leaving ~14 min of headroom. Raise both numbers together, and keep
  # the headroom — the whole point of H6 is that the job finishes on
  # its own rather than being killed.
  SOAK_SECONDS: "19800"

jobs:
  soak-weekly:
    name: soak ${{ matrix.workload }} (5h30m capped sample)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        workload: [token_bucket_1k]
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release -p luna-tools --bin luna-soak
        run: cargo build --release -p luna-tools --bin luna-soak
      - name: long soak — ${{ matrix.workload }}
        run: |
          ./target/release/luna-soak \
            --workload crates/luna-tools/workloads/${{ matrix.workload }}.lua \
            --duration "$SOAK_SECONDS" \
            --interval 300 \
            --out soak-${{ matrix.workload }}-5h30m.json
      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-weekly-${{ matrix.workload }}
          path: soak-${{ matrix.workload }}-5h30m.json
          retention-days: 90
