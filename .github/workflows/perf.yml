name: perf

# Same-runner benchmark comparison against the last release. It runs next
# to ci on every push instead of inside it: development does not wait on
# it, and a release needs it green.
on:
  push:
    branches: [master, develop]
    paths-ignore: ['**/*.md', 'docs/**', 'web/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  perf-gate:
    # Required gate, run as a same-runner comparison: hosted runners are
    # heterogeneous (identical code measured 0.51x-1.09x against a fixed-ns
    # baseline across runs), so the job builds the redis_lua_shape bench of
    # a pinned reference commit (PERF_REF, normally the last release) and of
    # HEAD, then scripts/perf-gate.sh measures them cell by cell in
    # alternating ref/head pairs, pinned to one core, over several rounds.
    # Bypass via [perf-allow] in the commit body for intentional
    # regressions; bump PERF_REF at each release.
    name: redis_lua_shape perf-gate
    runs-on: ubuntu-latest
    env:
      PERF_REF: 9b3754273629e3a6a0435cfd1d7075d7252c4c01 # v4.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build reference bench
        run: |
          git worktree add /tmp/perfref "$PERF_REF"
          cd /tmp/perfref
          bin=$(cargo bench -p luna-jit --bench redis_lua_shape --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "redis_lua_shape") | .executable')
          cp "$bin" /tmp/bench-ref
      - name: Build HEAD bench
        run: |
          bin=$(cargo bench -p luna-jit --bench redis_lua_shape --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "redis_lua_shape") | .executable')
          cp "$bin" /tmp/bench-head
      - name: perf-gate (interleaved same-runner comparison)
        run: ./scripts/perf-gate.sh /tmp/bench-ref /tmp/bench-head
