[package]
name = "llvm-jit-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Internal validation crate, never published. Setting
# `publish = false` matches the project convention for non-shipped
# crates and makes intent grep-able. The crate's sole purpose is to
# prove that the LLVM 18 + inkwell toolchain links + JITs correctly
# on the dev host.
publish = false

[dependencies]
# inkwell 0.9.0 only ships `llvm18-1` for LLVM 18 (there is no
# `llvm18-0` feature).
# `llvm18-1` pulls `llvm-sys = "181.x"` underneath, which requires LLVM
# 18.1.x. Dev host has LLVM 18.1.8 from
# `brew install llvm@18`, located at `/opt/homebrew/opt/llvm@18`.
#
# `llvm-sys`'s build script reads `LLVM_SYS_181_PREFIX` (note the
# version-major-minor in the var name) to locate `llvm-config`.
inkwell = { version = "0.9", features = ["llvm18-1"] }

[lints]
workspace = true
