[package]
name = "luna-jit"
description = "A Lua runtime in pure Rust — full 5.1/5.2/5.3/5.4/5.5 support. Equivalent to `luna-core` plus a Cranelift-backed JIT (method + trace) and the lua.h-compatible C ABI. (The `luna` crate name on crates.io is taken by an unrelated utility library; this crate is the JIT-equipped variant of the goliajp/luna Lua runtime.)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

# rlib: Rust embedders. cdylib + staticlib: existing C/C++ hosts can link
# against luna through its `capi` module (lua.h-compatible subset).
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "luna"
path = "src/bin/luna.rs"

[lints]
workspace = true

[dependencies]
# pure-interp + JIT trait surface lives here. `version = "= 4.0.1"`
# pins the matching luna-core release for `cargo publish` lookups when the
# `path` fallback isn't in play.
luna-core = { path = "../luna-core", version = "= 4.0.1" }

# `#[derive(LuaUserdata)]` + `#[lua_userdata_methods]`
# proc-macros. Re-exported in `lib.rs` so embedders can `use
# luna_jit::LuaUserdata;` for both the trait (via luna-core re-export)
# and the derive. Adds `syn` + `quote` + `proc-macro2` to luna-jit's
# build-time supply chain ONLY; luna-core stays 0-dep.
luna-jit-derive = { path = "../luna-jit-derive", version = "= 4.0.1" }

# `luna_jit_*` helper / TLS / enter_jit crate. luna-jit re-exports
# `pub use luna_jit_helpers::*;` from `jit_backend/mod.rs` so
# `crate::jit_backend::luna_jit_*` / `super::luna_jit_*` paths resolve.
# luna-jit-llvm depends on this crate directly without pulling Cranelift.
# `version = "= 4.0.1"` pin matches the workspace version so the
# crates.io resolver picks the exact matching release when embedders
# bypass the `path` fallback.
luna-jit-helpers = { path = "../luna-jit-helpers", version = "= 4.0.1" }

# LLVM 18 + inkwell 0.10 alternative JIT backend
# crate. Optional behind the `llvm-jit` cargo feature (default OFF)
# so the standard install path keeps Cranelift as the only JIT
# backend and the LLVM toolchain (~1 GB system deps) is not pulled
# into default builds. Embedders flip the backend at runtime via
# the `LUNA_JIT_BACKEND=llvm` env var. The `version = "= 4.0.1"` pin is
# required even for an optional dep when the parent crate is
# `publish = true`.
luna-jit-llvm = { path = "../luna-jit-llvm", version = "= 4.0.1", optional = true }

# JIT backend. cranelift is the mainstream Rust codegen for embedded
# JITs (wasmtime, cg_clif, etc.). aarch64 + x86-64 from day one,
# mature regalloc + opt. luna lowers Lua bytecode → Cranelift IR →
# mmap RWX. Pinned: the API churns enough that floating without a lock
# breaks builds.
cranelift = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-native = "0.136"
# object format of the module being lowered into, for data section names
target-lexicon = "0.13"
# page protection for the baseline trace tier's code (cranelift-jit already
# depends on it)
region = "3"

# optional rustyline-powered REPL polish (tab completion
# against Vm globals + Lua syntax highlighting + native
# `~/.luna_history`). Opt-in via `--features repl-line-editor`.
#
# Default `cargo install luna-jit` does NOT pull rustyline — lua.c's
# REPL reading plain lines from stdin stays the baseline so the shipped binary stays small and the supply-chain
# surface unchanged. luna-core remains 0-third-party-dep regardless;
# this dep lives in luna-jit only.
rustyline = { version = "18", optional = true }

[features]
# opt-in REPL polish. See the `rustyline` dep comment above.
# CI builds both with and without this feature (see .github/workflows/ci.yml
# `repl-line-editor` job) so the default-feature surface keeps verifying.
repl-line-editor = ["dep:rustyline"]

# opt-in LLVM 18 alt JIT backend. Default OFF; Cranelift remains the
# default backend. With this feature enabled, the
# `LUNA_JIT_BACKEND=llvm` env var (read by `install_default_jit` at
# Vm-construction time) selects the LLVM backend; unset / `cranelift` keeps Cranelift.
# A `panic!` with a helpful hint fires at install time when the env
# var is `llvm` but the feature is OFF.
#
# Local dev requires `LLVM_SYS_181_PREFIX` pointing at an LLVM 18.1.x
# install (e.g. `brew install llvm@18` →
# `/opt/homebrew/opt/llvm@18`). There is no CI matrix gate for it yet.
llvm-jit = ["dep:luna-jit-llvm"]

# forward the `send` feature to luna-core so embedders
# pulling `luna-jit --features send` automatically get
# `luna_jit::vm::SendVm` (re-exported via the crate's `pub use luna_core::*`
# tree). The luna-jit crate itself adds no extra Send-specific code; the
# JIT backend stays bound to bare `Vm` because `SendVm` is
# interp-only.
send = ["luna-core/send"]

# criterion as luna-jit-only dev-dep. The luna-core
# 0-third-party-dep contract is unaffected (CI `zero-dep` job verifies).
# `harness = false` on bench targets stays — criterion ships its own
# bench harness. macOS local variance gate: 2.5% (M-series with no
# public CPU pin API); Linux CI variance gate: ~1-2% via `taskset -c 1`.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# the Windows-only tests read the process's memory counters and drive the
# REPL through a pseudo console
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[bench]]
name = "lua_microbench"
harness = false

[[bench]]
name = "cross_dialect"
harness = false

[[bench]]
name = "run_only"
harness = false

[[bench]]
name = "redis_lua_shape"
harness = false

[[bench]]
name = "bench_send_overhead"
harness = false
